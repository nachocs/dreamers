<form class="sign-up-form" novalidate>
  <div class="sign-up-campo">
    <label for="signupAlias">Alias</label>
    <input type="text" id="signupAlias" name="alias" autocomplete="username" value="<%= obj.alias %>">
    <div class="sign-up-aviso <%= obj.aliasEstado %>"><%= obj.aliasMensaje %></div>
  </div>

  <div class="sign-up-campo">
    <label for="signupEmail">Email</label>
    <input type="email" id="signupEmail" name="email" autocomplete="email" value="<%= obj.email %>">
    <div class="sign-up-aviso <%= obj.emailEstado %>"><%= obj.emailMensaje %></div>
  </div>

  <div class="sign-up-campo">
    <label for="signupPassword">Clave</label>
    <input type="password" id="signupPassword" name="password" autocomplete="new-password" value="<%= obj.password %>">
    <div class="sign-up-aviso <%= obj.passwordEstado %>"><%= obj.passwordMensaje %></div>
  </div>

  <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect sign-up-enviar"
    id="signupSubmit" <%= obj.puedeEnviar ? '' : 'disabled' %>><%= obj.enviando ? 'un momento...' : 'registrarse' %></button>

  <div class="sign-up-aviso error sign-up-error-envio <%= obj.errorEnvio ? 'activo' : '' %>"><%= obj.errorEnvio %></div>

  <p class="sign-up-nota">
    Con esto ya puedes escribir y comentar. Si prefieres el formulario
    completo de siempre, con region y ciudad,
    <a href="https://dreamers.es/ciudad/registro/">est&aacute; aqu&iacute;</a>.
  </p>
</form>
